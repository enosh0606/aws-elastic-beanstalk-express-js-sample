# Docker Compose for Jenkins + Docker-in-Docker
# Jenkins runs in a container and can build Docker images using DinD

version: '3.8'

services:
  # Jenkins CI/CD server
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    restart: unless-stopped
    ports:
      - "8080:8080"    # Jenkins web UI
      - "50000:50000"  # Jenkins agent communication
    volumes:
      - jenkins_home:/var/jenkins_home    # Persist Jenkins data
      - /var/run/docker.sock:/var/run/docker.sock  # Allow Docker commands
    environment:
      - DOCKER_HOST=unix:///var/run/docker.sock
    user: root

  # Docker-in-Docker service
  dind:
    image: docker:dind
    container_name: dind
    restart: unless-stopped
    privileged: true    # Required for DinD
    volumes:
      - dind_storage:/var/lib/docker    # Persist Docker images
    environment:
      - DOCKER_TLS_CERTDIR=/certs
    ports:
      - "2376:2376"    # Docker daemon port

volumes:
  jenkins_home:    # Persist Jenkins configuration
  dind_storage:    # Persist Docker images
